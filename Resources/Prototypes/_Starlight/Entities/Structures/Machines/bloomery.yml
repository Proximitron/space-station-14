- type: entity
  id: Bloomery
  parent: BaseLathe
  name: bloomery
  description: A primitive furnace for turning steelmix and quartzmix powder into steel and glass sheets.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Machines/bloomery.rsi
    layers:
    - state: bloomery
      map: ["enum.LatheVisualLayers.IsRunning"]
  - type: MaterialStorage
    ignoreColor: true
    whitelist:
      tags:
      - BloomeryInput
  - type: Lathe
    idleState: bloomery
    runningState: burning
    defaultProductionAmount: 1
    staticPacks:
    - BloomerySmelting
  - type: Construction
    graph: Bloomery
    node: bloomery
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0
  - type: PowerState
    idlePowerDraw: 0
    workingPowerDraw: 0
